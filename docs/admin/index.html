<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="TBW Kalender">
<title>TBW Kalender verwalten</title>
<style>
/* ---------------------------------------------------------------------------
   TBW Kalender verwalten -- SPEC-ADMIN.md Abschnitt 6.

   Gestaltung nach dem Vorbild der Apple-Apps: auf dem iPhone wie eine
   iOS-App (großer Titel, durchscheinende Leisten, Reiterleiste mit Symbolen,
   gruppierte Listen, Schalter), am Mac wie eine macOS-App (Seitenleiste,
   Werkzeugleiste, etwas kleinere Schrift). Flächen, Text und Linien in den
   Systemfarben von iOS und macOS, die Schrift ist die Systemschrift
   (SF Pro auf Apple-Geräten).

   Das Aussehen lässt sich im Bereich „Darstellung“ einstellen: Farbstärke
   und einzelne Teamfarben, Knöpfe in Schwarz/Weiß oder Blau, die Anzeige
   für an/aus (Häkchen, Kreis, Schalter, Auge), der Aufbau der Liste
   (Gruppen, Liste, Agenda, Kompakt) und hell/dunkel. Die Einstellungen
   liegen in darstellung.json im Repository und gelten auf allen Geräten.
   Rot bleibt für Absagen, Fehler und Löschen.
--------------------------------------------------------------------------- */

/* Farbtoken. Hell steht auf :root, dunkel greift nach Systemeinstellung
   oder erzwungen über data-modus (Einstellung „Erscheinungsbild“). Die
   Akzentfarbe ist in eine helle und eine dunkle Fassung geteilt
   (--akzent-l/-d), damit die Einstellung „Knöpfe“ sie über data-akzent
   tauschen kann, ohne die Dunkel-Blöcke zu kennen. */
:root {
  --grund: #f2f2f7;
  --flaeche: #ffffff;
  --tinte: #000000;
  --tinte-2: rgba(60, 60, 67, 0.6);
  --tinte-3: rgba(60, 60, 67, 0.3);
  --linie: rgba(60, 60, 67, 0.29);
  --fuellung: rgba(118, 118, 128, 0.12);
  --gedrueckt: #d1d1d6;
  --schwebe: rgba(0, 0, 0, 0.03);
  --rot: #ff3b30;
  --schalter-aus: #e9e9eb;
  --reiter-aus: #8e8e93;
  --leiste: rgba(249, 249, 249, 0.94);
  --seitenleiste: #e8e8ed;
  --auswahl: rgba(0, 0, 0, 0.08);
  --fehler: var(--rot);

  /* Knöpfe „Schwarz/Weiß“: Schwarz im Hellen, Weiß im Dunklen. */
  --akzent-l: #1c1c1e;
  --akzent-d: #f2f2f7;
  --auf-akzent-l: #ffffff;
  --auf-akzent-d: #000000;
  --an-l: #1c1c1e;
  --an-d: #d1d1d6;
  --knopf-l: #ffffff;
  --knopf-d: #1c1c1e;
  --heute-l: #000000;
  --heute-d: #ffffff;
  --auf-heute-l: #ffffff;
  --auf-heute-d: #000000;

  --akzent: var(--akzent-l);
  --auf-akzent: var(--auf-akzent-l);
  --an: var(--an-l);
  --knopf: var(--knopf-l);
  --heute: var(--heute-l);
  --auf-heute: var(--auf-heute-l);

  /* Teamfarben: --team-<kürzel> je Team und --feed-extra für den Extra-Feed.
     Die Grundfarben stehen in config.yaml und kommen über pool.json; die
     Einstellung „Farbstärke“ mischt sie mit Grau. farbenSetzen() schreibt
     das Ergebnis in den Stilblock #teamfarben. --feed-extra gilt nur in der
     Übersicht: dort fragt die Linie "in welchem Kalender", nicht "welches
     Team". */

  --schrift: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* iPhone-Maße nach den Human Interface Guidelines. Am Mac werden sie
     weiter unten auf die macOS-Größen gesetzt. */
  --rand: 16px;
  --radius: 12px;
  --text: 17px;
  --text-klein: 15px;
  --zeile-hoehe: 60px;
  --spalte-zeit: 3.75rem;
  --schalter-b: 51px;
  --schalter-h: 31px;
  --leiste-hoehe: 44px;
  --reiter-hoehe: 50px;

  --oben: env(safe-area-inset-top, 0px);
  --unten: env(safe-area-inset-bottom, 0px);
  --links: env(safe-area-inset-left, 0px);
  --rechts: env(safe-area-inset-right, 0px);
}

/* Knöpfe „Blau“: der iOS-Akzent, grüne Schalter, der heutige Tag in Rot. */
:root[data-akzent="blau"] {
  --akzent-l: #007aff;
  --akzent-d: #0a84ff;
  --auf-akzent-l: #ffffff;
  --auf-akzent-d: #ffffff;
  --an-l: #34c759;
  --an-d: #30d158;
  --knopf-d: #ffffff;
  --heute-l: #ff3b30;
  --heute-d: #ff453a;
  --auf-heute-d: #ffffff;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-modus="hell"]) {
    --grund: #000000;
    --flaeche: #1c1c1e;
    --tinte: #ffffff;
    --tinte-2: rgba(235, 235, 245, 0.6);
    --tinte-3: rgba(235, 235, 245, 0.3);
    --linie: rgba(84, 84, 88, 0.65);
    --fuellung: rgba(118, 118, 128, 0.24);
    --gedrueckt: #2c2c2e;
    --schwebe: rgba(255, 255, 255, 0.04);
    --rot: #ff453a;
    --schalter-aus: #39393d;
    --reiter-aus: #98989d;
    --leiste: rgba(22, 22, 23, 0.92);
    --seitenleiste: #1c1c1e;
    --auswahl: rgba(255, 255, 255, 0.1);
    --akzent: var(--akzent-d);
    --auf-akzent: var(--auf-akzent-d);
    --an: var(--an-d);
    --knopf: var(--knopf-d);
    --heute: var(--heute-d);
    --auf-heute: var(--auf-heute-d);
    color-scheme: dark;
  }
}

:root[data-modus="dunkel"] {
  --grund: #000000;
  --flaeche: #1c1c1e;
  --tinte: #ffffff;
  --tinte-2: rgba(235, 235, 245, 0.6);
  --tinte-3: rgba(235, 235, 245, 0.3);
  --linie: rgba(84, 84, 88, 0.65);
  --fuellung: rgba(118, 118, 128, 0.24);
  --gedrueckt: #2c2c2e;
  --schwebe: rgba(255, 255, 255, 0.04);
  --rot: #ff453a;
  --schalter-aus: #39393d;
  --reiter-aus: #98989d;
  --leiste: rgba(22, 22, 23, 0.92);
  --seitenleiste: #1c1c1e;
  --auswahl: rgba(255, 255, 255, 0.1);
  --akzent: var(--akzent-d);
  --auf-akzent: var(--auf-akzent-d);
  --an: var(--an-d);
  --knopf: var(--knopf-d);
  --heute: var(--heute-d);
  --auf-heute: var(--auf-heute-d);
  color-scheme: dark;
}

:root[data-modus="hell"] { color-scheme: light; }

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--grund);
  color: var(--tinte);
  font-family: var(--schrift);
  font-size: var(--text);
  line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--akzent);
  outline-offset: 2px;
  border-radius: 4px;
}

.unsichtbar {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* --- Werkzeugleiste oben -------------------------------------------------
   Auf dem iPhone steht der große Titel im Inhalt. Beim Scrollen wird die
   Leiste durchscheinend und zeigt den Titel klein in der Mitte, wie in iOS.
   Der Weichzeichner sitzt auf ::before -- auf der Leiste selbst würde er
   den festen Speichern-Knopf an die Leiste statt ans Fenster binden. --- */

.leiste {
  position: sticky;
  top: 0;
  z-index: 30;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  min-height: calc(var(--leiste-hoehe) + var(--oben));
  padding: var(--oben) calc(var(--rand) + var(--rechts)) 0 calc(var(--rand) + var(--links));
}

.leiste::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: var(--grund);
  border-bottom: 0.5px solid transparent;
  transition: background-color 200ms ease, border-color 200ms ease;
}

.leiste--kompakt::before {
  background: var(--leiste);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom-color: var(--linie);
}

.leiste__titel {
  position: absolute;
  left: 50%;
  bottom: 11px;
  max-width: 50%;
  transform: translateX(-50%);
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transition: opacity 200ms ease;
}

.leiste--kompakt .leiste__titel { opacity: 1; }

/* Das Auswahlfeld liegt unsichtbar über der Beschriftung: getippt wird die
   native Auswahl des Systems, sichtbar ist nur der kurze Text mit Pfeil. */
.zeitraum {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  color: var(--akzent);
  font-size: 17px;
  cursor: pointer;
}

.zeitraum svg { width: 13px; height: 13px; }

.zeitraum select {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  font-size: 16px;
  cursor: pointer;
  appearance: none;
}

.zeitraum:focus-within { outline: 2px solid var(--akzent); outline-offset: 2px; border-radius: 6px; }

/* Auf dem iPhone schwebt der Knopf über der Reiterleiste, dort wo der
   Daumen ist. Er erscheint nur, wenn es etwas zu speichern gibt -- sein
   Dasein ist die Markierung der ungespeicherten Änderungen. */
.speichern {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 0 20px;
  border-radius: 14px;
  background: var(--akzent);
  color: var(--auf-akzent);
  font-size: 17px;
  font-weight: 600;
  white-space: nowrap;
}

.speichern:disabled { opacity: 0.4; cursor: default; }

#speichern {
  position: fixed;
  z-index: 25;
  left: calc(var(--rand) + var(--links));
  right: calc(var(--rand) + var(--rechts));
  bottom: calc(var(--reiter-hoehe) + var(--unten) + 12px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

/* --- Statusmeldung ------------------------------------------------------ */

.status {
  margin: 8px calc(var(--rand) + var(--rechts)) 0 calc(var(--rand) + var(--links));
  padding: 12px 16px;
  background: var(--flaeche);
  border-radius: var(--radius);
  font-size: var(--text-klein);
  line-height: 1.4;
}

.status--fehler { color: var(--fehler); }
.status p { margin: 0; }
.status p + p { margin-top: 4px; }
.status__hinweis { color: var(--tinte-2); }
.status--fehler .status__hinweis { color: var(--tinte-2); }

.status__knoepfe {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 20px;
  margin-top: 4px;
}

.textknopf {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--akzent);
  font-size: var(--text);
  font-weight: 600;
}

.textknopf--rot { color: var(--rot); }

/* --- Aufbau ---------------------------------------------------------------- */

.app { min-height: 100vh; }

.haupt {
  min-width: 0;
  padding-bottom: 32px;
}

body.angemeldet .haupt {
  padding-bottom: calc(var(--reiter-hoehe) + var(--unten) + 32px);
}

body.hat-aenderungen .haupt {
  padding-bottom: calc(var(--reiter-hoehe) + var(--unten) + 100px);
}

.inhalt {
  padding-left: var(--links);
  padding-right: var(--rechts);
}

.grosstitel {
  margin: 2px var(--rand) 10px;
  font-size: 34px;
  line-height: 41px;
  font-weight: 700;
  letter-spacing: 0.01em;
}

/* --- Reiterleiste (iPhone) ------------------------------------------------ */

.navigation {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  padding: 0 var(--rechts) var(--unten) var(--links);
  background: var(--leiste);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--linie);
}

.navigation__kopf { display: none; }

.navigation button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-width: 0;
  height: var(--reiter-hoehe);
  color: var(--reiter-aus);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.navigation svg { width: 26px; height: 26px; flex: none; }

.navigation button[aria-current="true"] { color: var(--akzent); }

.nav-lang { display: none; }

/* --- Filter-Chips (Übersicht und Andere Teams) -------------------------- */

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px var(--rand) 14px;
  scroll-padding: 0 var(--rand);
}

.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 14px;
  border-radius: 17px;
  background: var(--fuellung);
  font-size: var(--text-klein);
  font-weight: 500;
  white-space: nowrap;
}

.chip__punkt {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--farbe, var(--tinte-3));
}

/* Trainings: derselbe Farbton, weniger Gewicht -- wie an der Zeile. */
.chip__punkt--training { opacity: 0.45; }

.chip__zahl {
  color: var(--tinte-2);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"] { background: var(--akzent); color: var(--auf-akzent); }
.chip[aria-pressed="true"] .chip__zahl { color: inherit; opacity: 0.75; }
.chip[aria-pressed="true"] .chip__punkt { box-shadow: 0 0 0 1.5px var(--auf-akzent); opacity: 1; }

.chip-kurz { display: inline; }
.chip-lang { display: none; }

/* --- Gruppierte Liste: ein Tag, eine Gruppe ----------------------------- */

.gruppe { margin: 0 calc(var(--rand)); }
.gruppe + .gruppe { margin-top: 24px; }

.datum {
  margin: 0 0 7px;
  padding: 0 16px;
  font-size: var(--text-klein);
  font-weight: 600;
  color: var(--tinte-2);
}

/* Der heutige Tag hervorgehoben: in Schriftfarbe bei Schwarz/Weiß, in Rot
   bei Blau (wie im Kalender von Apple). */
.datum--heute { color: var(--heute); }

.datum__wt, .datum__nr { display: none; }

.liste {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--flaeche);
  border-radius: var(--radius);
  overflow: hidden;
}

.liste > li { position: relative; }

/* Trennlinie wie in iOS: beginnt erst hinter der Farbleiste. */
.liste > li + li::before {
  content: "";
  position: absolute;
  z-index: 1;
  top: 0;
  right: 0;
  left: 30px;
  border-top: 0.5px solid var(--linie);
}

/* --- Die Terminzeile -----------------------------------------------------
   Farbleiste | Beginn und Ende | Titel und Ort | Schalter.
   Die ganze Zeile ist das Ziel.                                        --- */

.zeile {
  position: relative;
  display: grid;
  grid-template-columns: var(--spalte-zeit) minmax(0, 1fr) auto;
  align-items: center;
  gap: 0 12px;
  width: 100%;
  min-height: var(--zeile-hoehe);
  padding: 10px 16px 10px 30px;
  text-align: left;
  transition: background-color 150ms ease;
}

button.zeile:active { background: var(--gedrueckt); }

@media (hover: hover) {
  button.zeile:hover { background: var(--schwebe); }
  button.zeile:active { background: var(--gedrueckt); }
}

button.zeile:focus-visible { outline-offset: -3px; border-radius: 0; }

/* Die Leiste trägt zwei Angaben ohne Etikett: der Farbton sagt, welches
   Team, die Füllung, ob der Termin im Kalender liegt. */
.zeile::before {
  content: "";
  position: absolute;
  left: 16px;
  top: 10px;
  bottom: 10px;
  width: 4px;
  border-radius: 2px;
  background: var(--farbe, var(--tinte-3));
  transition: opacity 180ms ease, background-color 180ms ease;
}

/* Trainings: gleiche Kante, geringeres Gewicht. */
.zeile[data-typ="training"]::before { opacity: 0.45; }

/* Fremdes Spiel, nicht im Kalender: hohle Leiste. */
.zeile[data-an="false"][data-fremd="true"]::before {
  background: none;
  box-shadow: inset 0 0 0 1.5px var(--farbe, var(--tinte-3));
  opacity: 0.7;
}

/* Ausgeblendet: durchgestrichen, zurückgenommen, Leiste grau -- und die
   Zeile bleibt an ihrer Stelle stehen. */
.zeile[data-an="false"][data-fremd="false"]::before {
  background: var(--tinte-3);
  opacity: 1;
}

.zeile[data-an="false"][data-fremd="false"] .zeile__titel,
.zeile[data-an="false"][data-fremd="false"] .zeile__ort,
.zeile[data-an="false"][data-fremd="false"] .zeile__zeit {
  color: var(--tinte-3);
}

.zeile[data-an="false"][data-fremd="false"] .zeile__titel {
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.zeile__zeit {
  align-self: start;
  display: grid;
  gap: 2px;
  padding-top: 1px;
  font-size: var(--text-klein);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.zeile__ende { color: var(--tinte-2); }

/* Zwei eigene Zeilen: beides sind span-Elemente, weil in einem button kein
   div stehen darf. */
.zeile__text { display: grid; gap: 2px; min-width: 0; }

.zeile__titel {
  display: block;
  font-size: var(--text);
  line-height: 1.3;
  transition: color 180ms ease;
}

.zeile__ort {
  display: block;
  font-size: var(--text-klein);
  color: var(--tinte-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zeile__abgesagt { color: var(--rot); font-weight: 600; }

/* Das Häkchen am Zeilenende, wie in den Einstellungen von iOS: da heißt
   „liegt im Kalender“, fehlt heißt „nicht im Kalender“. Es ist die Anzeige,
   getroffen wird die ganze Zeile. */
.haken {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  color: var(--akzent);
}

.haken svg { width: 18px; height: 18px; opacity: 0; transition: opacity 150ms ease; }
[data-an="true"] > .haken svg { opacity: 1; }

/* Kreis mit Haken, wie in der Erinnerungen-App. */
.kreis {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--tinte-3);
  color: var(--auf-akzent);
  transition: background-color 180ms ease, box-shadow 180ms ease;
}

.kreis svg { width: 13px; height: 13px; opacity: 0; transition: opacity 150ms ease; }
[data-an="true"] > .kreis { background: var(--akzent); box-shadow: none; }
[data-an="true"] > .kreis svg { opacity: 1; }

/* Auge: offen heißt sichtbar, durchgestrichen heißt ausgeblendet. */
.auge { display: grid; place-items: center; width: 28px; height: 24px; color: var(--tinte-2); }
.auge svg { width: 24px; height: 24px; }
.auge .auge--zu { display: none; }
[data-an="false"] > .auge { color: var(--tinte-3); }
[data-an="false"] > .auge .auge--offen { display: none; }
[data-an="false"] > .auge .auge--zu { display: block; }

/* Der Schalter von iOS: im Formular („Ganztägig“) und als Anzeige-Variante
   in den Terminzeilen. */
.schalter-knopf {
  position: relative;
  flex: none;
  display: block;
  width: var(--schalter-b);
  height: var(--schalter-h);
  border-radius: 999px;
  background: var(--schalter-aus);
  transition: background-color 200ms ease;
}

.schalter-knopf::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(var(--schalter-h) - 4px);
  height: calc(var(--schalter-h) - 4px);
  border-radius: 50%;
  background: var(--knopf);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
  transition: transform 200ms ease;
}

[aria-pressed="true"] > .schalter-knopf,
[data-an="true"] > .schalter-knopf { background: var(--an); }

[aria-pressed="true"] > .schalter-knopf::after,
[data-an="true"] > .schalter-knopf::after {
  transform: translateX(calc(var(--schalter-b) - var(--schalter-h)));
}

@media (prefers-reduced-motion: reduce) {
  .zeile, .zeile::before, .zeile__titel,
  .schalter-knopf, .schalter-knopf::after, .haken svg, .kreis, .kreis svg,
  .leiste::before, .leiste__titel { transition: none; }
}

/* --- Ladezustand: die Liste steht schon, während die Daten kommen ------- */

.platzhalter { pointer-events: none; }
.platzhalter .balken {
  display: block;
  height: 11px;
  border-radius: 3px;
  background: var(--fuellung);
}
.platzhalter .balken--titel { width: 62%; }
.platzhalter .balken--ort { width: 40%; margin-top: 8px; }
.platzhalter .zeile__zeit .balken { width: 2.5rem; }

/* --- Hinweise und Fehler ------------------------------------------------ */

.hinweis {
  max-width: 30rem;
  margin: 0 auto;
